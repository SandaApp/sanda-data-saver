plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.sanda.datasaver'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanda.datasaver"
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Safe: reads from keystore.properties if exists, else env vars, else debug fallback
            // Place sanda_release.jks in app/ folder and create keystore.properties in android-app/ folder
            def storeFilePath = keystoreProperties['storeFile'] ?: 'sanda_release.jks'
            def storeFileObj = file(storeFilePath)
            // Only configure if jks exists, otherwise Android Studio will generate signed bundle manually via wizard
            if (storeFileObj.exists()) {
                storeFile storeFileObj
                storePassword keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: "dsr316pw"
                keyAlias keystoreProperties['keyAlias'] ?: "sanda_key"
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: "dsr316pw"
            }
        }
        debug {
            // Default debug keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // For GitHub Actions cloud build without keystore, use debug signing automatically
            // For local Android Studio with keystore, use release signing
            // signingConfig is set dynamically: if sanda_release.jks exists, use release, else debug
            if (file('sanda_release.jks').exists() || file(keystoreProperties['storeFile'] ?: 'sanda_release.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
    
    // FIX: Prevent Arena freeze - disable lint abort on release
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
