name: Sanda Data Saver - Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.16)'
        required: true
        default: '1.0.16'
env:
  PYTHON_VERSION: '3.11'
  JAVA_VERSION: '17'

jobs:
  # -------------------------------------------------
  # PC App - Windows Build (PyInstaller EXE + Inno Setup)
  # -------------------------------------------------
  build-pc-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
          echo "Version: ${{ steps.version.outputs.VERSION }}"

      - name: Install Python dependencies
        working-directory: pc-app
        run: |
          python -m pip install --upgrade pip
          pip install pystray pillow pyinstaller

      - name: Build EXE with PyInstaller (Windows)
        working-directory: pc-app
        run: |
          echo "${{ steps.version.outputs.VERSION }}" > VERSION.txt
          pyinstaller --noconsole --onefile --uac-admin --icon="assets\sanda_icon.ico" --add-data "assets\sanda_logo.png;assets" --add-data "assets\sanda_icon.ico;assets" --add-data "VERSION.txt;." --name=SandaDataSaver sanda_pc_app.py

      - name: Verify EXE
        working-directory: pc-app
        shell: pwsh
        run: |
          Get-ChildItem dist/
          if (!(Test-Path dist/SandaDataSaver.exe)) { exit 1 }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Installer
        working-directory: pc-app
        run: |
          iscc sanda_pc_setup.iss

      - name: Upload PC Artifacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: sanda-pc-windows
          path: |
            pc-app/dist/SandaDataSaver.exe
            pc-app/InstallerOutput/*.exe
            pc-app/VERSION.txt

  # -------------------------------------------------
  # PC App - macOS Build (PyInstaller with ICNS)
  # -------------------------------------------------
  build-pc-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
          echo "Version: ${{ steps.version.outputs.VERSION }}"

      - name: Install Python dependencies (macOS)
        working-directory: pc-app
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller
          # pystray may need extra deps on macOS, but we install anyway

      - name: Build Binary (macOS) with ICNS
        working-directory: pc-app
        run: |
          echo "${{ steps.version.outputs.VERSION }}" > VERSION.txt
          pyinstaller --noconsole --onefile --icon="assets/sanda_icon.icns" --add-data "assets/sanda_logo.png:assets" --add-data "assets/sanda_icon.icns:assets" --add-data "VERSION.txt:." --name=SandaDataSaver sanda_pc_app.py || pyinstaller --noconsole --onefile --add-data "assets/sanda_logo.png:assets" --add-data "VERSION.txt:." --name=SandaDataSaver sanda_pc_app.py

      - name: Verify macOS Binary
        working-directory: pc-app
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/SandaDataSaver || test -f dist/SandaDataSaver_macOS || ls dist/

      - name: Rename for Release
        working-directory: pc-app
        shell: bash
        run: |
          cd dist
          if [ -f SandaDataSaver ]; then cp SandaDataSaver SandaDataSaver_macOS; fi
          if [ -f SandaDataSaver_macOS ]; then chmod +x SandaDataSaver_macOS; fi
          ls -lh

      - name: Upload PC Artifacts macOS
        uses: actions/upload-artifact@v4
        with:
          name: sanda-pc-macos
          path: |
            pc-app/dist/SandaDataSaver
            pc-app/dist/SandaDataSaver_macOS
            pc-app/VERSION.txt

  # -------------------------------------------------
  # PC App - Linux Build (PyInstaller)
  # -------------------------------------------------
  build-pc-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
          echo "Version: ${{ steps.version.outputs.VERSION }}"

      - name: Install Python dependencies (Linux)
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller
          pip install pystray || echo "pystray optional on Linux"

      - name: Build Binary (Linux)
        working-directory: pc-app
        run: |
          echo "${{ steps.version.outputs.VERSION }}" > VERSION.txt
          pyinstaller --noconsole --onefile --add-data "assets/sanda_logo.png:assets" --add-data "VERSION.txt:." --name=SandaDataSaver sanda_pc_app.py

      - name: Verify Linux Binary
        working-directory: pc-app
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/SandaDataSaver

      - name: Rename for Release
        working-directory: pc-app
        shell: bash
        run: |
          cd dist
          cp SandaDataSaver SandaDataSaver_Linux || true
          chmod +x SandaDataSaver_Linux || true
          ls -lh

      - name: Upload PC Artifacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: sanda-pc-linux
          path: |
            pc-app/dist/SandaDataSaver
            pc-app/dist/SandaDataSaver_Linux
            pc-app/VERSION.txt

  # -------------------------------------------------
  # Android App - Build APK (Java)
  # -------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned, for testing)
        working-directory: android-app
        run: |
          ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file=debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android || echo "Release build needs keystore, skipping"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sanda-android-apk
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk

  # -------------------------------------------------
  # Compatibility Check (syntax)
  # -------------------------------------------------
  build-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (without winreg)
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray

      - name: Syntax check sanda_pc_app.py
        run: |
          python -m py_compile pc-app/sanda_pc_app.py
          echo "Syntax OK"

  # -------------------------------------------------
  # GitHub Release
  # -------------------------------------------------
  release:
    needs: [build-pc-windows, build-pc-macos, build-pc-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/sanda-pc-windows/dist/SandaDataSaver.exe
            artifacts/sanda-pc-windows/InstallerOutput/*.exe
            artifacts/sanda-pc-macos/SandaDataSaver
            artifacts/sanda-pc-macos/SandaDataSaver_macOS
            artifacts/sanda-pc-linux/SandaDataSaver
            artifacts/sanda-pc-linux/SandaDataSaver_Linux
            artifacts/sanda-android-apk/**/*.apk
          body: |
            ## 🛡️ Sanda Data Saver v${{ github.ref_name }}

            **Smart Data. Your Control. Focus on Jesus.**

            ### 📦 Downloads
            - **Windows EXE Portable:** `SandaDataSaver.exe` (no install, tray blue/red WiFi)
            - **Windows Installer:** `SandaDataSaver_Setup_v*.exe` (PC Cleaner + Health)
            - **macOS:** `SandaDataSaver` or `SandaDataSaver_macOS` (Apple Silicon & Intel, icns icon 1.4MB)
            - **Linux:** `SandaDataSaver` or `SandaDataSaver_Linux` (Ubuntu 20.04+, Python 3.11)
            - **Android APK:** `app-debug.apk` (v${{ github.ref_name }} with Health 20 tips)
            - **Android AAB:** Build signed AAB in Android Studio for Play Store

            ### ✨ What's New in v1.0.16 - Health + ALL GREEN
            - 💚 **NEW Health Reminders:** 20 tips to distract excessive gaming/social media: Gaming Break Psalm 46:10, Social Detox Philippians 4:8, Prayer Matthew 6:6, Scripture Joshua 1:8, Constructive Colossians 3:23, Eye 20-20-20, etc. Every 30/60/120 min notification with Bible verse + practical action. Local only, no data collected.
            - 🖥️ **Available on All Platforms:** Android, Windows EXE, Windows Installer, macOS (icns), Linux (ELF) — All built via GitHub Actions
            - 🎨 New Sanda logo everywhere: Splash 2.5s, About v1.0.16 Dr, main page 56dp, widget, settings footer v1.0.16
            - 🔍 App Manager: 9 defaults + Reset + Filter instant + Search <5 sec + Stop dark red + height 500 + instant open
            - 🧹 PC Cleaner: 5 checkboxes + 3 buttons + 680x580 window + silent auto-clean 24h
            - 🔒 100% Private offline-first, no tracking, no ads, VPN local 127.0.0.1 no remote
            - ✅ Fixed: Windows installer VersionInfo, Type mismatch, S:786 app constant, Android mipmap round, old logo, duplicate resources, ProGuard, toolchain Foojay download

            ### 🛠️ Build
            - Built with Python ${{ env.PYTHON_VERSION }}, PyInstaller, Inno Setup 6, icns 1.4MB, ico 117KB
            - Android: Java ${{ env.JAVA_VERSION }}, Gradle, compileSdk 34, versionCode 16
            - Platforms: Windows (windows-latest), macOS (macos-latest), Linux (ubuntu-latest), Android (ubuntu-latest)

            ### 🔒 Privacy v1.0.16
            - Privacy Policy Aug 8 2026: VPN local disclosure, Health Reminders disclosure, full permissions table (PACKAGE_USAGE_STATS, NETWORK_STATE, FOREGROUND_SERVICE, POST_NOTIFICATIONS, QUERY_ALL_PACKAGES, BIND_VPN_SERVICE, READ/WRITE_EXTERNAL_STORAGE cleaner, SCHEDULE_EXACT_ALARM, etc) — No data collected/shared
            - Website: https://www.davidsanda.com/apps/privacy.html v1.0.16

            *“Freely you have received; freely give.” — Matthew 10:8* ✝️

            By Bishop Dr. David Sanda — Free for Jesus
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
